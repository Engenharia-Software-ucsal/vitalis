server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clinico
              uri: ${CLINICO_URL:http://localhost:8081}
              predicates:
                - Path=/api/clinico/**
              filters:
                - StripPrefix=2
            - id: leitos
              uri: ${LEITOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/leitos/**
              filters:
                - StripPrefix=2
            - id: ia
              uri: ${IA_URL:http://localhost:8083}
              predicates:
                - Path=/api/ia/**
              filters:
                - StripPrefix=2

vitalis:
  jwt:
    secret: ${JWT_SECRET:vitalis-dev-secret-key-256-bits-minimum-length-2026!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
