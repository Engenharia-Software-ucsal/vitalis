server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clinico
              uri: ${CLINICO_URL:http://localhost:8081}
              predicates:
                - Path=/api/clinico/**
              filters:
                - StripPrefix=2
            - id: leitos
              uri: ${LEITOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/leitos/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
