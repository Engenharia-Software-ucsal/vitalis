server:
  port: 8081

spring:
  application:
    name: servico-clinico
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitalis_clinico}
    username: ${DB_USER:vitalis}
    password: ${DB_PASSWORD:vitalis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
