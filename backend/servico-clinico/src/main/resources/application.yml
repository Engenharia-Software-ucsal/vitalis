server:
  port: 8081

spring:
  application:
    name: servico-clinico
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitalis_clinico}
    username: ${DB_USER:vitalis}
    password: ${DB_PASSWORD:vitalis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

vitalis:
  jwt:
    secret: ${JWT_SECRET:vitalis-dev-secret-key-256-bits-minimum-length-2026!}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 28800
  leitos-url: ${LEITOS_URL:http://localhost:8082}
