name: vitalis

x-db-env: &db-env
  DB_USER: ${DB_USER:-${POSTGRES_USER:-vitalis}}
  DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-vitalis}}
  DB_POOL_MAX: ${DB_POOL_MAX:-5}

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-vitalis-dev-secret-key-256-bits-minimum-length-2026!}

services:
  postgres:
    image: postgres:17
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitalis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalis}
      POSTGRES_DB: vitalis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  servico-clinico:
    build:
      context: ./backend
      args:
        MODULE: servico-clinico
    environment:
      <<: [*db-env, *common-env]
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/vitalis_clinico?sslmode=${DB_SSLMODE:-disable}
      LEITOS_URL: http://servico-leitos:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  servico-leitos:
    build:
      context: ./backend
      args:
        MODULE: servico-leitos
    environment:
      <<: [*db-env, *common-env]
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/vitalis_leitos?sslmode=${DB_SSLMODE:-disable}
      CLINICO_URL: http://servico-clinico:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  servico-ia:
    build:
      context: ./backend
      args:
        MODULE: servico-ia
    environment:
      <<: [*db-env, *common-env]
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/vitalis_ia?sslmode=${DB_SSLMODE:-disable}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-${OPENROUTER_API_KEY:-}}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      AI_EXTRA_HEADERS_REFERER: ${AI_EXTRA_HEADERS_REFERER:-https://vitalis.ucsal.br}
      AI_EXTRA_HEADERS_TITLE: ${AI_EXTRA_HEADERS_TITLE:-Vitalis Hospitalar}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: ./backend
      args:
        MODULE: gateway
    environment:
      <<: *common-env
      CLINICO_URL: http://servico-clinico:8081
      LEITOS_URL: http://servico-leitos:8082
      IA_URL: http://servico-ia:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      servico-clinico:
        condition: service_healthy
      servico-leitos:
        condition: service_healthy
      servico-ia:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
